# Lazygit config
# https://github.com/jesseduffield/lazygit/blob/master/docs/Config.md

gui:
  showIcons: true
  nerdFontsVersion: "3"
  showBottomLine: false
  showCommandLog: false

git:
  paging:
    colorArg: always
  autoFetch: true
  autoRefresh: true

confirmOnQuit: false

keybinding:
  universal:
    quit: "q"
